<h2 id="loginTitle">Admin Login</h2>

<div id="loginSection">
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="adminLogin()">Login</button>
</div>

<button onclick="logout()">Logout</button>

<hr>
<h2>Dashboard Analytics</h2>

<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;">

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Total Users</h3>
    <p id="totalUsers">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Total Orders</h3>
    <p id="totalOrders">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Total Reviews</h3>
    <p id="totalReviews">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Revenue</h3>
    <p id="totalRevenue">₹0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Pending</h3>
    <p id="pendingOrders">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Processing</h3>
    <p id="processingOrders">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Shipped</h3>
    <p id="shippedOrders">0</p>
  </div>

  <div style="border:1px solid #ccc;padding:15px;">
    <h3>Delivered</h3>
    <p id="deliveredOrders">0</p>
  </div>

</div>
<h2>Order Management</h2>

<div id="orders">
Loading Orders...
</div>
<h2>Admin Review Panel</h2>

<div>
  <button onclick="filterProduct('all')">All</button>
  <button onclick="filterProduct('belt')">Belt</button>
  <button onclick="filterProduct('heatpack')">Heat Pack</button>
</div>

<div id="reviews"></div>

<script>
function logout(){
  localStorage.removeItem("adminToken");
  alert("Logged out");
  location.reload();
}

// ================= LOGIN =================
async function adminLogin(){
  try{
    const res = await fetch("https://calorix-backend.onrender.com/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value,
        password:document.getElementById("password").value
      })
    });

    if(!res.ok){
      alert("Invalid username or password");
      return;
    }

    const data = await res.json();
    localStorage.setItem("adminToken",data.token);

   alert("Login successful");

document.getElementById("loginSection").style.display = "none";
document.getElementById("loginTitle").style.display = "none";

loadReviews();
loadAnalytics();
loadOrders();

  } catch(err){
    alert("Login failed");
  }
}

// ================= LOAD REVIEWS =================
async function loadReviews(){
  const token = localStorage.getItem("adminToken");

  if(!token){
    alert("Please login first");
    return;
  }

  const container = document.getElementById("reviews");
  container.innerHTML = "Loading...";

  try{
    const res = await fetch("https://calorix-backend.onrender.com/admin/reviews",{
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(res.status === 401 || res.status === 403){
      alert("Session expired. Please login again.");
      logout();
      return;
    }

    window.allReviews = await res.json();
    renderReviews(window.allReviews);

  } catch(err){
    container.innerHTML = "Failed to load reviews";
  }
}

// ================= RENDER =================
function escapeHTML(str){
  return str.replace(/[&<>"']/g, function(m){
    return ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[m];
  });
}

function renderReviews(reviews){
  const container = document.getElementById("reviews");
  container.innerHTML = "";

  reviews.forEach(r=>{
    container.innerHTML += `
    <div style="border:1px solid #ccc;padding:10px;margin:10px">
      <b>${escapeHTML(r.name)}</b> &#9733; ${r.rating}<br>
      Order ID: ${r.orderCode || "N/A"}<br>

      ${r.product ? `<p><b>Product:</b> ${r.product}</p>` : ""}
      <p>${escapeHTML(r.comment)}</p>

      ${r.verified ? "&#10004; Verified Purchase" : ""}

      <br><br>

      ${!r.approved 
        ? `<button onclick="approveReview('${r._id}')">Approve</button>` 
        : "✅ Approved"
      }

      ${!r.verified 
        ? `<button onclick="verifyReview('${r._id}')">Verify</button>` 
        : ""
      }

      <button onclick="deleteReview('${r._id}')">Delete</button>
    </div>
    `;
  });
}

// ================= ACTIONS =================
async function approveReview(id){
  await handleRequest(`review/${id}/approve`, "PUT");
}

async function deleteReview(id){
  await handleRequest(`review/${id}`, "DELETE");
}

async function verifyReview(id){
  await handleRequest(`review/${id}/verify`, "PUT");
}

async function handleRequest(endpoint, method){
  const token = localStorage.getItem("adminToken");

  if(!token){
    alert("Please login first");
    return;
  }

  try{
    const res = await fetch(`https://calorix-backend.onrender.com/admin/${endpoint}`,{
      method:method,
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(!res.ok) throw new Error("Action failed");

    loadReviews();

  } catch(err){
    alert(err.message);
  }
}
async function loadOrders(){

  const token =
    localStorage.getItem("adminToken");

  const res = await fetch(
    "https://calorix-backend.onrender.com/admin/orders",
    {
      headers:{
        Authorization:`Bearer ${token}`
      }
    }
  );

  const orders =
    await res.json();

  const container =
    document.getElementById("orders");

  container.innerHTML = "";

  orders.forEach(order=>{

    container.innerHTML += `
      <div style="
      border:1px solid #ccc;
      padding:10px;
      margin:10px">

      <b>${order.orderCode || "N/A"}</b><br>

      Customer:
      ${order.name || "Unknown"}<br>

      Amount: &#8377;${order.totalAmount || 0}<br>

      Status:
      <b>${order.status}</b><br><br>

      <button
      onclick="updateStatus(
      '${order._id}',
      'Processing')">
      Processing
      </button>

      <button
      onclick="updateStatus(
      '${order._id}',
      'Shipped')">
      Shipped
      </button>

      <button
      onclick="updateStatus(
      '${order._id}',
      'Delivered')">
      Delivered
      </button>

      </div>
    `;

  });

}
async function updateStatus(
id,
status
){

  const token =
  localStorage.getItem("adminToken");

  await fetch(
  `https://calorix-backend.onrender.com/admin/order/${id}/status`,
  {
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${token}`
    },
    body:JSON.stringify({
      status
    })
  });

  loadOrders();
}
// ================= FILTER =================
function filterProduct(type){
  if(type === "all"){
    renderReviews(window.allReviews);
    return;
  }

  const filtered = window.allReviews.filter(r =>
    r.product && r.product.toLowerCase() === type.toLowerCase()
  );

  renderReviews(filtered);
}
async function loadAnalytics(){

  const token = localStorage.getItem("adminToken");

  const res = await fetch(
    "https://calorix-backend.onrender.com/admin/analytics",
    {
      headers:{
        Authorization:`Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("Analytics Data:", data);

  document.getElementById("totalUsers").innerText =
    data.totalUsers;

  document.getElementById("totalOrders").innerText =
    data.totalOrders;

  document.getElementById("totalReviews").innerText =
  data.totalReviews;
  document.getElementById("totalRevenue").innerHTML =
  `&#8377;${data.totalRevenue}`;
  document.getElementById("pendingOrders").innerText =
  data.pendingOrders;

document.getElementById("processingOrders").innerText =
  data.processingOrders;

document.getElementById("shippedOrders").innerText =
  data.shippedOrders;

document.getElementById("deliveredOrders").innerText =
  data.deliveredOrders;
}
// ================= AUTO LOAD =================
window.onload = () => {


  if(localStorage.getItem("adminToken")){

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("loginTitle").style.display = "none";

    loadReviews();
    loadAnalytics();
    loadOrders();
  }

};
</script>
