<!DOCTYPE html>
<html>
<head>
  <title>Calorix Admin Dashboard</title>
<style>
.users-card{
  background:#4361ee !important;
  color:white !important;
}

.orders-card{
  background:#2a9d8f !important;
  color:white !important;
}

.reviews-card{
  background:#00b4d8 !important;
  color:white !important;
}

.revenue-card{
  background:#212529 !important;
  color:white !important;
}

.pending-card{
  background:#ffb703 !important;
  color:black !important;
}

.processing-card{
  background:#6c757d !important;
  color:white !important;
}

.shipped-card{
  background:#3a86ff !important;
  color:white !important;
}

.delivered-card{
  background:#06d6a0 !important;
  color:white !important;
}
.card{
  border:none;
  border-radius:18px;
  transition:all 0.3s ease;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,0.15) !important;
}

.analytics-card .card-body{
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.card h2{
  font-size:2.5rem;
  font-weight:700;
}

.card h5{
  font-size:1rem;
  font-weight:600;
  opacity:0.9;
}
#orderChart{
  max-height:350px;
}
body{
  background:#f5f7fb;
}
</style>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">

    <span class="navbar-brand">
      Calorix Admin Dashboard
    </span>

    <button
      class="btn btn-danger"
      onclick="logout()">
      Logout
    </button>

  </div>
</nav>
<div class="container mt-4">
<h2 id="loginTitle">Admin Login</h2>

<div id="loginSection">
  <div class="row g-2 mb-4">
  <div class="col-md-4">
    <input class="form-control" type="text" id="username" placeholder="Username">
  </div>

  <div class="col-md-4">
    <input class="form-control" type="password" id="password" placeholder="Password">
  </div>

  <div class="col-md-2">
    <button class="btn btn-primary w-100" onclick="adminLogin()">
      Login
    </button>
  </div>
</div>

</div>

<div id="dashboardSection" style="display:none;">

  <hr>

  <h2 class="mb-4 fw-bold">
    <i class="bi bi-bar-chart-fill"></i>
    Dashboard Analytics
  </h2>

  <div class="row g-4">

    <!-- Total Users -->
    <div class="col-md-3">
      <div class="card analytics-card users-card shadow">
        <div class="card-body">
          <h5>Total Users</h5>
          <h2 id="totalUsers">0</h2>
        </div>
      </div>
    </div>

    <!-- Total Orders -->
    <div class="col-md-3">
      <div class="card analytics-card orders-card shadow">
        <div class="card-body">
          <h5>Total Orders</h5>
          <h2 id="totalOrders">0</h2>
        </div>
      </div>
    </div>

    <!-- Total Reviews -->
    <div class="col-md-3">
      <div class="card analytics-card reviews-card shadow">
        <div class="card-body">
          <h5>Total Reviews</h5>
          <h2 id="totalReviews">0</h2>
        </div>
      </div>
    </div>

    <!-- Revenue -->
    <div class="col-md-3">
      <div class="card analytics-card revenue-card shadow">
        <div class="card-body">
          <h5>Total Revenue</h5>
          <h2 id="totalRevenue">₹0</h2>
        </div>
      </div>
    </div>

    <!-- Pending -->
    <div class="col-md-3">
      <div class="card analytics-card pending-card shadow">
        <div class="card-body">
          <h5>Pending</h5>
          <h2 id="pendingOrders">0</h2>
        </div>
      </div>
    </div>

    <!-- Processing -->
    <div class="col-md-3">
      <div class="card analytics-card processing-card shadow">
        <div class="card-body">
          <h5>Processing</h5>
          <h2 id="processingOrders">0</h2>
        </div>
      </div>
    </div>

    <!-- Shipped -->
    <div class="col-md-3">
      <div class="card analytics-card shipped-card shadow">
        <div class="card-body">
          <h5>Shipped</h5>
          <h2 id="shippedOrders">0</h2>
        </div>
      </div>
    </div>

    <!-- Delivered -->
    <div class="col-md-3">
      <div class="card analytics-card delivered-card shadow">
        <div class="card-body">
          <h5>Delivered</h5>
          <h2 id="deliveredOrders">0</h2>
        </div>
      </div>
    </div>

  </div>

  <h2 class="mt-5">Order Statistics</h2>

  <div class="card shadow-sm p-3 mb-4">
    <canvas id="orderChart" height="120"></canvas>
  </div>

  <h2>Order Management</h2>

  <div id="orders">
    Loading Orders...
  </div>

  <h2 class="mt-4">Admin Review Panel</h2>

  <div id="reviews"></div>

</div>

<script>
function logout(){
  localStorage.removeItem("adminToken");

  document.getElementById("dashboardSection").style.display = "none";

  document.getElementById("loginSection").style.display = "block";

  document.getElementById("loginTitle").style.display = "block";

  alert("Logged out");
  location.reload();
}

// ================= LOGIN =================
async function adminLogin(){
  try{
    const res = await fetch("https://calorix-backend.onrender.com/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value,
        password:document.getElementById("password").value
      })
    });

    if(!res.ok){
      alert("Invalid username or password");
      return;
    }

    const data = await res.json();
    localStorage.setItem("adminToken",data.token);

   alert("Login successful");

document.getElementById("loginSection").style.display = "none";
document.getElementById("loginTitle").style.display = "none";
document.getElementById("dashboardSection").style.display = "block";
loadReviews();
loadAnalytics();
loadOrders();

  } catch(err){
    alert("Login failed");
  }
}

// ================= LOAD REVIEWS =================
async function loadReviews(){
  const token = localStorage.getItem("adminToken");

  if(!token){
    alert("Please login first");
    return;
  }

  const container = document.getElementById("reviews");
  container.innerHTML = "Loading...";

  try{
    const res = await fetch("https://calorix-backend.onrender.com/admin/reviews",{
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(res.status === 401 || res.status === 403){
      alert("Session expired. Please login again.");
      logout();
      return;
    }

    window.allReviews = await res.json();
    renderReviews(window.allReviews);

  } catch(err){
    container.innerHTML = "Failed to load reviews";
  }
}

// ================= RENDER =================
function escapeHTML(str){
  return str.replace(/[&<>"']/g, function(m){
    return ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[m];
  });
}

function renderReviews(reviews){
  const container = document.getElementById("reviews");
  container.innerHTML = "";

  reviews.forEach(r => {

  container.innerHTML += `

  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <h5>
        ${escapeHTML(r.name)}
       <span class="badge bg-warning text-dark">
  <i class="bi bi-star-fill"></i> ${r.rating}
</span>
      </h5>

      <p>
        <strong>Order ID:</strong>
        ${r.orderCode || "N/A"}
      </p>

      ${r.product
        ? `<p><strong>Product:</strong> ${r.product}</p>`
        : ""
      }

      <p>${escapeHTML(r.comment)}</p>

      ${
        r.verified
          ? `<span class="badge bg-success">
               Verified Purchase
             </span>`
          : ""
      }
${r.product
  ? `<span class="badge bg-secondary">${r.product}</span>`
  : ""
}

      ${
        !r.approved
          ? `
          <button
            class="btn btn-success btn-sm"
            onclick="approveReview('${r._id}')">
            Approve
          </button>
          `
          : `
          <span class="badge bg-primary">
            Approved
          </span>
          `
      }

      ${
        !r.verified
          ? `
          <button
            class="btn btn-info btn-sm"
            onclick="verifyReview('${r._id}')">
            Verify
          </button>
          `
          : ""
      }

      <button
        class="btn btn-danger btn-sm"
        onclick="deleteReview('${r._id}')">
        Delete
      </button>

    </div>
  </div>

  `;

});
}

// ================= ACTIONS =================
async function approveReview(id){
  await handleRequest(`review/${id}/approve`, "PUT");
}

async function deleteReview(id){
  await handleRequest(`review/${id}`, "DELETE");
}

async function verifyReview(id){
  await handleRequest(`review/${id}/verify`, "PUT");
}

async function handleRequest(endpoint, method){
  const token = localStorage.getItem("adminToken");

  if(!token){
    alert("Please login first");
    return;
  }

  try{
    const res = await fetch(`https://calorix-backend.onrender.com/admin/${endpoint}`,{
      method:method,
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(!res.ok) throw new Error("Action failed");

    loadReviews();
loadAnalytics();
  } catch(err){
    alert(err.message);
  }
}
async function loadOrders(){

  const token =
    localStorage.getItem("adminToken");

  const res = await fetch(
    "https://calorix-backend.onrender.com/admin/orders",
    {
      headers:{
        Authorization:`Bearer ${token}`
      }
    }
  );

  if(!res.ok){
  throw new Error("Failed to load orders");
}

const orders = await res.json();

  const container =
    document.getElementById("orders");

  container.innerHTML = "";

  orders.forEach(order=>{

let badgeColor = "secondary";

if(order.status === "Pending")
  badgeColor = "warning";

if(order.status === "Processing")
  badgeColor = "info";

if(order.status === "Shipped")
  badgeColor = "primary";

if(order.status === "Delivered")
  badgeColor = "success";
    container.innerHTML += `
<div class="card shadow-sm mb-3">
  <div class="card-body">

    <h5>
      ${order.orderCode || "N/A"}
    </h5>

    <p>
      <strong>Customer:</strong>
      ${order.name || "Unknown"}
    </p>

    <p>
      <strong>Amount:</strong>
      &#8377;${order.totalAmount || 0}
    </p>

    <p>
      <strong>Status:</strong>
      <span class="badge bg-${badgeColor}">
        ${order.status}
      </span>
    </p>

    <button
      class="btn btn-warning btn-sm"
      onclick="updateStatus(
      '${order._id}',
      'Processing')">
      Processing
    </button>

    <button
      class="btn btn-primary btn-sm"
      onclick="updateStatus(
      '${order._id}',
      'Shipped')">
      Shipped
    </button>

    <button
      class="btn btn-success btn-sm"
      onclick="updateStatus(
      '${order._id}',
      'Delivered')">
      Delivered
    </button>

  </div>
</div>
`;

  });

}
async function updateStatus(
id,
status
){

  const token =
  localStorage.getItem("adminToken");

  await fetch(
  `https://calorix-backend.onrender.com/admin/order/${id}/status`,
  {
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${token}`
    },
    body:JSON.stringify({
      status
    })
  });

  loadOrders();
loadAnalytics();
}
// ================= FILTER =================
function filterProduct(type){
  if(type === "all"){
    renderReviews(window.allReviews);
    return;
  }

  const filtered = window.allReviews.filter(r =>
    r.product && r.product.toLowerCase() === type.toLowerCase()
  );

  renderReviews(filtered);
}
async function loadAnalytics(){

  const token = localStorage.getItem("adminToken");

  const res = await fetch(
    "https://calorix-backend.onrender.com/admin/analytics",
    {
      headers:{
        Authorization:`Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("Analytics Data:", data);

  document.getElementById("totalUsers").innerText =
    data.totalUsers;

  document.getElementById("totalOrders").innerText =
    data.totalOrders;

  document.getElementById("totalReviews").innerText =
  data.totalReviews;
  document.getElementById("totalRevenue").innerHTML =
  `&#8377;${data.totalRevenue}`;
  document.getElementById("pendingOrders").innerText =
  data.pendingOrders;

document.getElementById("processingOrders").innerText =
  data.processingOrders;

document.getElementById("shippedOrders").innerText =
  data.shippedOrders;

document.getElementById("deliveredOrders").innerText =
  data.deliveredOrders;
 const ctx = document.getElementById("orderChart");

if (
  window.orderChart &&
  typeof window.orderChart.destroy === "function"
){
  window.orderChart.destroy();
}

window.orderChart = new Chart(ctx,{
  type:"bar",
  data:{
    labels:[
      "Pending",
      "Processing",
      "Shipped",
      "Delivered"
    ],
    datasets:[{
      label:"Orders",
      data:[
        data.pendingOrders,
        data.processingOrders,
        data.shippedOrders,
        data.deliveredOrders
      ],
      backgroundColor:[
        "#ffb703",
        "#6c757d",
        "#3a86ff",
        "#06d6a0"
      ]
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false
  }
});
}

// ================= AUTO LOAD =================
window.onload = () => {


  if(localStorage.getItem("adminToken")){

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("loginTitle").style.display = "none";
    document.getElementById("dashboardSection").style.display = "block";

    loadReviews();
    loadAnalytics();
    loadOrders();
  }

};
</script>
</div>

</body>
</html>
